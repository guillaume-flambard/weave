# Construit l'image avec nixpacks, exactement comme le faisait Coolify (memes
# commandes install/build/start, meme version de Node), et la pousse sur GHCR.
# Le VPS la tire ensuite tout seul ; ce workflow ne pretend pas avoir deploye.
#
# Genere depuis lab-infra/ci/build-nixpacks.yml — ne pas editer a la main,
# relancer ./scripts/install-ci.sh <app>.
name: build weave-web

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/build-weave-web.yml
  workflow_dispatch: {}

concurrency:
  # le nom du workflow porte l'app (le depot weave en heberge deux, api et web) :
  # avec un groupe commun elles s'annulaient l'une l'autre
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer nixpacks
        run: curl -sSL https://nixpacks.com/install.sh | bash

      - name: Construire
        run: |
          nixpacks build apps/web \
            --name ghcr.io/guillaume-flambard/weave-web:${{ github.sha }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --env NIXPACKS_NODE_VERSION=22 \
            -i 'pnpm install' -b 'pnpm build' -s 'pnpm start'

      - name: Pousser le sha
        run: docker push ghcr.io/guillaume-flambard/weave-web:${{ github.sha }}

      # :latest UNIQUEMENT depuis main : sinon un workflow_dispatch lance depuis
      # une branche de travail publierait l'image que l'agent deploie en 2 minutes.
      - name: Pousser latest (main seulement)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ghcr.io/guillaume-flambard/weave-web:${{ github.sha }} ghcr.io/guillaume-flambard/weave-web:latest
          docker push ghcr.io/guillaume-flambard/weave-web:latest